services:
  # PostgreSQL
  postgresql:
    image: postgres:15
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USERNAME}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_DB: ${ADMIN_DB}
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USERNAME}"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_compose
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Auth service
  auth:
    build: ./backend/authservice
    container_name: auth
    restart: unless-stopped
    environment:
      DB_HOST: postgresql
      RABBITMQ_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:${RABBIT_DEFAULT_PORT}/
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import http.client; conn=http.client.HTTPConnection('localhost', 8000); conn.request('GET', '/api/auth/v1/health-check'); r=conn.getresponse(); exit(0 if r.status==200 else 1)\""]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Wallet service
  wallet:
    build: ./backend/walletservice
    container_name: wallet
    restart: unless-stopped
    environment:
      DB_HOST: postgresql
      RABBITMQ_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:${RABBIT_DEFAULT_PORT}/
      PUBLIC_KEY_ENDPOINT: http://${AUTHORIZATION_SERVICE_NAME}:${HTTP_SERVER_PORT}/api/auth/v1/public-key
    depends_on:
      auth:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import http.client; conn=http.client.HTTPConnection('localhost', 8000); conn.request('GET', '/api/wallet/v1/health-check'); r=conn.getresponse(); exit(0 if r.status==200 else 1)\""]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Card service
  card:
    build: ./backend/cardservice
    container_name: card
    restart: unless-stopped
    environment:
      DB_HOST: postgresql
      RABBITMQ_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:${RABBIT_DEFAULT_PORT}/
      PUBLIC_KEY_ENDPOINT: http://${AUTHORIZATION_SERVICE_NAME}:${HTTP_SERVER_PORT}/api/auth/v1/public-key
    depends_on:
      auth:
        condition: service_healthy
      wallet:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import http.client; conn=http.client.HTTPConnection('localhost', 8000); conn.request('GET', '/api/card/v1/health-check'); r=conn.getresponse(); exit(0 if r.status==200 else 1)\""]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Notification service
  notification:
    build: ./backend/notificationservice
    container_name: notification
    restart: unless-stopped
    environment:
      DB_HOST: postgresql
      RABBITMQ_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:${RABBIT_DEFAULT_PORT}/
      PUBLIC_KEY_ENDPOINT: http://${AUTHORIZATION_SERVICE_NAME}:${HTTP_SERVER_PORT}/api/auth/v1/public-key
    depends_on:
      auth:
        condition: service_healthy      
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import http.client; conn=http.client.HTTPConnection('localhost', 8000); conn.request('GET', '/api/notification/v1/health-check'); r=conn.getresponse(); exit(0 if r.status==200 else 1)\""]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s
  
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - backend
    depends_on:
      auth:
        condition: service_healthy
      wallet:
        condition: service_healthy

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth:
        condition: service_healthy
      wallet:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge
